<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verken de torenkamer en bibliotheek van Spelbound.">
  <title>Spelbound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=DM+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#f3d38d;--paper:#f6ecd9;--night:#0e1021}
    *{box-sizing:border-box}
    body{margin:0;color:var(--paper);background:var(--night);font:1rem/1.55 'DM Sans',system-ui,sans-serif}
    .hero{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;
      display:grid;place-items:center;padding:clamp(24px,5vw,72px);
      background:radial-gradient(ellipse at 74% 38%,#473451 0%,#26223e 36%,#14172c 67%,#101225 88%)}
    .hero::before,.hero::after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none}
    .hero::before{opacity:.58;background-image:
      radial-gradient(circle,#f6dca2 0 1px,transparent 1.5px),
      radial-gradient(circle,#b2b9e9 0 1px,transparent 1.5px);
      background-size:123px 109px,179px 137px;background-position:18px 28px,75px 62px;
      mask-image:linear-gradient(#000 0%,#000 42%,transparent 88%)}
    .hero::after{background:linear-gradient(0deg,#101225,transparent 26%)}
    .stars{position:absolute;inset:0;z-index:-1;pointer-events:none}
    .stars i{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;background:#ffe8a9;
      box-shadow:0 0 8px #f5d294;opacity:.22;animation:twinkle var(--period) var(--delay) infinite ease-in-out}
    @keyframes twinkle{0%,72%,100%{opacity:.22} 83%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.stars i{animation:none}}
    .layout{width:min(100%,1160px);display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
      align-items:center;gap:clamp(24px,4vw,70px)}
    .intro{position:relative;z-index:1}
    .mark{display:flex;align-items:center;gap:12px;color:var(--gold);width:97px;margin-bottom:10px}
    .mark::before,.mark::after{content:"";height:1px;flex:1;background:#d8b97888}
    h1{font:700 clamp(3.2rem,7.7vw,7.8rem)/.94 'Cormorant Garamond',Georgia,serif;
      letter-spacing:-.065em;color:var(--gold);margin:0;text-shadow:0 4px 0 #412b42,0 10px 30px #100d20}
    .intro p{max-width:30ch;margin:28px 0 25px;color:#e4d9e6;text-wrap:pretty}
    .play{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:10px 27px;
      border:1px solid #ffdf99;background:#eac176;color:#21182a;box-shadow:3px 4px #795966;
      font-weight:700;text-decoration:none}
    .play:hover{background:#ffdda0;transform:translateY(-1px)}
    .play:focus-visible{outline:3px solid #fff;outline-offset:5px}
    .scene{position:relative;display:grid;place-items:center;min-width:0;margin:0}
    .scene::before{content:"";position:absolute;z-index:-1;width:76%;aspect-ratio:1;border-radius:50%;
      border:1px solid #dab38251;box-shadow:0 0 0 9px #dab38213,0 0 70px #b47c452b;
      background:radial-gradient(circle at 44% 43%,#9e6d6855,#4e385132 74%,transparent 75%)}
    .scene img{display:block;width:100%;max-width:610px;height:auto;image-rendering:pixelated;
      filter:drop-shadow(0 19px 15px #0e1021)}
    @media(max-width:700px){
      .hero{padding:42px 20px 28px}
      .layout{grid-template-columns:1fr;gap:24px;text-align:center}
      .mark,.intro p{margin-inline:auto}
      h1{font-size:clamp(3.1rem,12.5vw,6rem)}
      .scene img{width:min(100%,390px)}
    }
    @media(prefers-reduced-motion:reduce){.play:hover{transform:none}}
  </style>
</head>
<body>
  <main class="hero">
    <div class="stars" aria-hidden="true">
      <i style="--x:10%;--y:14%;--period:7s;--delay:-1s"></i>
      <i style="--x:37%;--y:10%;--period:9s;--delay:-5s"></i>
      <i style="--x:65%;--y:17%;--period:8s;--delay:-3s"></i>
      <i style="--x:88%;--y:12%;--period:11s;--delay:-7s"></i>
      <i style="--x:17%;--y:39%;--period:10s;--delay:-7s"></i>
      <i style="--x:52%;--y:26%;--period:12s;--delay:-2s"></i>
      <i style="--x:94%;--y:43%;--period:9s;--delay:-4s"></i>
      <i style="--x:74%;--y:67%;--period:13s;--delay:-10s"></i>
    </div>
    <div class="layout">
      <div class="intro">
        <div class="mark" aria-hidden="true">✦</div>
        <h1>Spelbound</h1>
        <p>Neem plaats bij het vuur, dwaal door de bibliotheek en ontdek wie er in de toren woont.</p>
        <a class="play" href="./game.html"><span aria-hidden="true">▶</span> Spelen</a>
      </div>
      <figure class="scene">
        <img src="./assets/images/tower-preview.png" width="346" height="358" alt="De torenkamer in pixelstijl, met de tovenaar, een open haard en een boekenkast">
      </figure>
    </div>
  </main>
</body>
</html>
