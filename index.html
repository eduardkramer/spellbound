<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spellbound</title>
  <style>
    :root{color-scheme:dark;--navy:#11152b;--gold:#edc577;--text:#f6ebd8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:clamp(16px,5vw,64px);
      background:radial-gradient(ellipse at 72% 42%,#282344,var(--navy) 63%,#0b0e1e);
      color:var(--text);font:16px/1.55 'Courier Prime','Courier New',monospace}
    main{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1fr;align-items:center;
      border:1px solid #6d5669;background:#171a33;box-shadow:0 0 0 5px #111429,0 20px 64px #080a17}
    .intro{padding:clamp(28px,5vw,72px)}
    h1{margin:0;color:var(--gold);font-size:clamp(2.7rem,6vw,5.2rem);line-height:.98;
      letter-spacing:-.065em;text-shadow:3px 3px #4c3445}
    h1 span{display:block}
    p{max-width:34ch;margin:24px 0 30px;color:#d3cce1}
    .play{display:inline-flex;align-items:center;gap:.65em;padding:12px 26px;border:2px solid #f9d898;
      background:var(--gold);color:#22172b;box-shadow:4px 4px #805038;font-weight:bold;text-decoration:none}
    .play:hover{background:#ffdc9b}
    .play:focus-visible{outline:3px solid white;outline-offset:6px}
    .art{margin:0;min-width:0;padding:clamp(14px,3vw,32px);min-height:100%;display:grid;place-items:center;
      border-left:1px solid #51435b;background:radial-gradient(ellipse,#332b4b 0%,#1b1c38 70%)}
    img{display:block;width:min(100%,440px);height:auto;image-rendering:pixelated}
    @media(max-width:680px){
      main{grid-template-columns:1fr}
      .art{border-left:0;border-top:1px solid #51435b}
      img{width:min(100%,280px)}
    }
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <h1>Spellbound</h1>
      <p>Verken de toren, warm je bij de haard en ontdek wie er tussen de boeken woont.</p>
      <a class="play" href="./game.html"><span aria-hidden="true">▶</span> Spelen</a>
    </div>
    <figure class="art">
      <img src="./assets/images/tower-preview.png" alt="De pixelachtige torenkamer met tovenaar, open haard en boekenkast">
    </figure>
  </main>
</body>
</html>
